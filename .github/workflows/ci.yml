name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root and client dependencies
        run: |
          npm ci || npm install
          npm --prefix client ci || npm --prefix client install

      - name: Run ESLint
        run: npm run lint

      - name: Run all test suites
        run: npm test

      - name: Build client production bundle
        run: npm run build
